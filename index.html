<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#12131a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Torsk</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        /* dvh tracks mobile browser chrome; 100% above is the fallback. */
        height: 100dvh;
        background: #12131a;
        overflow: hidden;
        /* The canvas is the whole UI, so stock touch gestures are disabled. */
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      /* EXPAND sizes the canvas from this element, so it must be exactly the
         window; a shrink-to-fit parent would pin the game at its minimum. */
      #game {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #game canvas {
        /* Keep the upscaled canvas crisp, not smoothed. */
        image-rendering: pixelated;
        touch-action: none;
        /* Not inline: the baseline gap would overflow the parent. */
        display: block;
      }
    </style>
    <script type="module" crossorigin src="/torsk/assets/index-CRTIpbjR.js"></script>
  <link rel="manifest" href="/torsk/manifest.webmanifest"></head>
  <body>
    <div id="game"></div>
  </body>
</html>
